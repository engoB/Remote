name: Mise à jour des offres

on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6 h (4 fois par jour, rythme demandé par Remotive)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: maj-offres
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collecter les offres
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: python fetch.py
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Mise à jour des offres"
          git push
